name: Update Hackatime Stats

on:
  schedule:
    - cron: "0 */4 * * *"  
  workflow_dispatch: {}       # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Hackatime stats
        env:
          HACKATIME_OAUTH_TOKEN: ${{ secrets.HACKATIME_OAUTH_TOKEN }}
        run: node scripts/fetchhackatime.js
        
      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update hackatime stats"
          file_pattern: data/hackatime.json
